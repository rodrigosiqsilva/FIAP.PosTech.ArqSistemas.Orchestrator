apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: fiap-fcg-cluster
  region: us-east-1
  version: "1.36"

managedNodeGroups:
  - name: fcg-nodes
    instanceType: c7i-flex.large  
    desiredCapacity: 2
    minSize: 1
    maxSize: 3
    volumeSize: 20
    ssh:
      enableSsm: true
    labels:
      role: worker
