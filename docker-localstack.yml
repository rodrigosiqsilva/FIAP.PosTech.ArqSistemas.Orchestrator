version: '3.8'

services:
  localstack:
    container_name: localstack_main
    image: localstack/localstack:latest
    ports:
      - "127.0.0.1:4566:4566"            # Porta principal do Gateway LocalStack
      - "127.0.0.1:4510-4559:4510-4559"    # Intervalo para serviços externos
    environment:
      - DEBUG=${DEBUG:-0}
    volumes:
      - "./localstack_data:/var/lib/localstack"
      - "//var/run/docker.sock:/var/run/docker.sock"